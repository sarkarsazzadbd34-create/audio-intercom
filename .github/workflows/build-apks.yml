name: Build APKs

# Builds both the Transmitter and Receiver debug APKs on every push to main,
# and lets you trigger it manually from the Actions tab. Runs entirely on
# GitHub's servers - free for public repos (and for private repos within
# GitHub's free monthly Actions minutes).
#
# After a run finishes: go to Actions -> the run -> scroll to "Artifacts" ->
# download "transmitter-debug-apk" and/or "receiver-debug-apk".

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-transmitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Transmitter debug APK
        working-directory: transmitter-app
        run: gradle assembleDebug --no-daemon

      - name: Upload Transmitter APK
        uses: actions/upload-artifact@v4
        with:
          name: transmitter-debug-apk
          path: transmitter-app/app/build/outputs/apk/debug/app-debug.apk

  build-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Receiver debug APK
        working-directory: receiver-app
        run: gradle assembleDebug --no-daemon

      - name: Upload Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver-app/app/build/outputs/apk/debug/app-debug.apk
